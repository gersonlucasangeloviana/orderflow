name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: Build and test server modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Restore server projects
        run: |
          for project in src/OrderFlow.Api src/OrderFlow.Web src/OrderFlow.Admin.Mvc src/OrderFlow.Freight src/OrderFlow.Notifications src/OrderFlow.LogIngestion; do
            dotnet restore "$project"
          done
      - name: Build Release
        run: |
          for project in src/OrderFlow.Api src/OrderFlow.Web src/OrderFlow.Admin.Mvc src/OrderFlow.Freight src/OrderFlow.Notifications src/OrderFlow.LogIngestion; do
            dotnet build "$project" -c Release --no-restore
          done
      - name: Run tests
        run: |
          for project in tests/*/*.csproj; do
            dotnet test "$project" -c Release --logger "trx;LogFileName=test-results.trx"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
      - name: Dependency vulnerability report
        run: |
          for project in src/OrderFlow.Api src/OrderFlow.Web src/OrderFlow.Admin.Mvc src/OrderFlow.Freight src/OrderFlow.Notifications src/OrderFlow.LogIngestion; do
            dotnet list "$project" package --vulnerable --include-transitive
          done

  docker:
    name: Verify Docker images
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - name: Build deployable images without publishing
        run: |
          for image in OrderFlow.Api OrderFlow.Web OrderFlow.Admin.Mvc OrderFlow.Freight OrderFlow.Notifications OrderFlow.LogIngestion; do
            docker build --file "src/$image/Dockerfile" --tag "orderflow/${image,,}:ci" .
          done
      - name: Validate Compose files
        run: docker compose --env-file .env.example -f deploy/docker-compose.yml -f deploy/docker-compose.production.yml config --quiet

  mobile:
    name: Build MAUI Android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: |
          dotnet workload install maui-android
          dotnet workload restore src/OrderFlow.Mobile.Maui/OrderFlow.Mobile.Maui.csproj
      - run: dotnet build src/OrderFlow.Mobile.Maui/OrderFlow.Mobile.Maui.csproj -c Release

  secrets:
    name: Scan secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
