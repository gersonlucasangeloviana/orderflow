name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore OrderFlow.sln
      - run: dotnet build OrderFlow.sln -c Release --no-restore
      - run: dotnet test OrderFlow.sln -c Release --no-build
      - run: dotnet list OrderFlow.sln package --vulnerable --include-transitive
      - uses: gitleaks/gitleaks-action@v2
